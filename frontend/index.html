<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생일 선물 공구</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 24px auto; padding: 0 16px; }
  .bar { background: #eee; border-radius: 8px; height: 20px; overflow: hidden; }
  .fill { background: #4caf50; height: 100%; width: 0; transition: width .3s; }
  input, button { font-size: 16px; padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; }
  #msg { margin: 8px 0; min-height: 1.2em; }
  .err { color: #c62828; }
  .ok { color: #2e7d32; }
  li { margin: 4px 0; }
</style>
</head>
<body>
  <h1 id="title">불러오는 중...</h1>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <p id="status"></p>

  <h2>참여하기</h2>
  <input id="nickname" placeholder="닉네임">
  <input id="amount" type="number" placeholder="금액 (원)">
  <button id="btn">참여</button>
  <div id="msg"></div>

  <h2>참여 내역</h2>
  <ul id="list"></ul>

<script>
const $ = (id) => document.getElementById(id);
const roomId = new URLSearchParams(location.search).get("room");

function show(text, ok) {
  const m = $("msg");
  m.textContent = text;
  m.className = ok ? "ok" : "err";
}

// 모금 현황을 서버에서 가져와 화면에 그리기
async function load() {
  if (!roomId) {
    $("title").textContent = "주소 끝에 ?room=3 처럼 방 번호를 붙여주세요";
    return;
  }
  try {
    const res = await fetch("/rooms/" + roomId);
    const data = await res.json();
    if (!res.ok) { $("title").textContent = data.error || "오류가 났어요"; return; }

    $("title").textContent = data.title;
    $("fill").style.width = Math.min(100, data.collected / data.target * 100) + "%";
    $("status").textContent =
      data.collected.toLocaleString() + " / " + data.target.toLocaleString() + "원";

    const list = $("list");
    list.innerHTML = "";
    for (const c of data.contributions) {
      const li = document.createElement("li");
      li.textContent = c.nickname + " : " + c.amount.toLocaleString() + "원";
      list.appendChild(li);
    }
  } catch (e) {
    $("status").textContent = "서버에 연결할 수 없어요";
  }
}

// 참여 버튼
$("btn").addEventListener("click", async () => {
  const nickname = $("nickname").value.trim();
  const amount = parseInt($("amount").value, 10);
  if (!nickname || !(amount > 0)) { show("닉네임과 금액을 확인해주세요", false); return; }

  $("btn").disabled = true;
  try {
    const res = await fetch("/rooms/" + roomId + "/contributions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nickname, amount })
    });
    const data = await res.json();
    if (res.ok) show("참여 완료!", true);
    else if (res.status === 409)
      show("목표를 넘어요. 최대 " + data.remaining.toLocaleString() + "원까지 낼 수 있어요", false);
    else show(data.error || "실패했어요", false);
  } catch (e) {
    show("서버에 연결할 수 없어요", false);
  }
  $("btn").disabled = false;
  load();
});

load();
setInterval(load, 3000);   // 3초마다 새로고침: 다른 친구가 내면 내 화면에도 반영
</script>
</body>
</html>
